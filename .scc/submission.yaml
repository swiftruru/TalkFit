  zh-TW:
    name: TalkFit｜綠園練習簿
    intro: TalkFit 是一款溫暖、低壓力的 iOS 私人口說教練，適合準備課堂報告、自我介紹、
      面試回答、簡報與公開發言的學生和工作者。使用者錄下一段短講後，TalkFit 會透過 Apple Speech
      產生逐字稿，分析贅字、語速、停頓與最需要改善的片段，讓使用者不必 重說整篇，而是直接針對最關鍵的一小段立即重練，最後用前後比較看見贅字減少、
      節奏與穩定度的進步。App 支援繁體中文與英文，採用可解釋的本機規則，不保存錄音 與逐字稿，並在語音辨識不可用時提供清楚、不冒充真實內容的示範備援。
