event: iOS AI Summer Camp 2026
name: TalkFit
team_name: 小狐狸
category: education
intro: |
  TalkFit — Let every time you speak become visible growth.

  Many people know that a presentation, interview answer, or self-introduction did not sound quite right, but they do not know what to improve first. Listening to an entire recording again takes time, while a transcript or a score alone rarely tells someone what to do next. TalkFit turns that vague frustration into one small, practical action: find the segment that matters most, retry it immediately, and make the improvement visible.

  TalkFit is a warm, low-pressure iOS speaking coach for students, presenters, interview candidates, and anyone who wants to communicate more clearly in Traditional Chinese or English. It is not a web recorder, a social network, or a medical diagnosis tool. It is a private practice space designed to help users build confidence through short, focused repetitions.

  THE CORE EXPERIENCE

  1. Choose a real speaking situation — self-introduction, presentation, class report, interview answer, or a section from a complete script.
  2. Record naturally while seeing elapsed time, a live waveform, partial transcription, recently detected filler evidence, and sentence-level pace guidance.
  3. Receive one plain-language priority instead of a crowded analytics dashboard.
  4. Open the exact segment worth improving and follow one concrete coaching cue.
  5. Retry only that segment rather than repeating the entire speech.
  6. Compare the before and after results through filler count, pace, rhythm reminders, and stability.

  WHY TALKFIT FEELS DIFFERENT

  TalkFit does not treat speaking practice as a test. There are no leaderboards, streak pressure, or intimidating scores. Its “Garden Notebook” visual system uses warm fibrous paper, pine and moss greens, small clay-orange annotations, and growing leaves to make practice feel quiet, tactile, and encouraging. Progress is presented as something that can grow, not something that must be perfect on the first try.

  EXPLAINABLE, LOCAL FEEDBACK

  The app uses Apple Speech for transcription and transparent on-device rules for analysis. Traditional Chinese pace is measured in readable characters per minute; English pace is measured in words per minute. TalkFit also reviews sentence timing, overly short or long pauses, sudden acceleration, filler density, and overall delivery stability. The result is an understandable recommendation, not an unexplained AI verdict.

  Apple’s final transcript may remove short hesitation sounds such as “嗯,” “呃,” “um,” or “uh” to produce cleaner text. TalkFit therefore keeps readable text and filler evidence as two separate tracks. Partial results, alternative transcriptions, timestamps, and confidence signals can preserve evidence that the final transcript omits. When a filler was heard but does not belong in the readable sentence, the report can show it separately instead of inserting artificial words into the transcript. Users can also maintain separate Traditional Chinese and English filler libraries for their own speaking habits.

  BUILT FOR REAL PRACTICE

  Users can switch between Traditional Chinese and English, choose context-specific prompts, or paste a complete script and practice it section by section. Script practice checks content coverage with simple local matching, highlights a few ideas that may have been missed, and avoids pretending to understand meaning with a hidden model. A Home Screen widget offers a quick path back into practice when an important conversation is approaching.

  PRIVATE BY DESIGN

  TalkFit has no proprietary cloud backend for speech content or analysis. When supported by the device, the app requests on-device Apple speech recognition; actual recognition availability is determined by Apple and the user’s device. Practice history is optional. If enabled, summaries and the user’s real audio recordings can be saved locally on that iPhone for replay. Scripts, transcripts, sentence content, and filler timestamps are not written into the archive. Demo sessions are never saved, and users can stop future saving or delete stored sessions at any time.

  RELIABLE WHEN THE DEMO ENVIRONMENT IS NOT

  Microphone permission, speech availability, and Simulator behavior can be unpredictable. TalkFit never replaces meaningful user speech with an unrelated sample transcript. If no usable recognition result exists, it explains what happened and offers either another recording or an explicitly labeled demonstration. A deterministic sample service can still complete the full record → report → retry → comparison journey without masquerading as real analysis.

  TalkFit’s most important moment is simple: after speaking once, the user knows exactly what to retry — and a minute later can see that the second attempt is genuinely clearer. Instead of asking people to “speak better,” TalkFit gives them a small place to begin.
