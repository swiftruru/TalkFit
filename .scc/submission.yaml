event: iOS AI Summer Camp 2026
name: TalkFit
team_name: 小狐狸
category: education
intro: TalkFit is a warm, low-pressure iOS speaking coach for students,
  presenters, interview candidates, and anyone who wants to communicate more
  clearly. After a short recording, TalkFit uses Apple Speech to create a
  readable transcript and analyzes filler words, speaking pace, pauses, and the
  segment that needs the most attention. Instead of repeating the entire speech,
  the user immediately retries one focused segment and sees a clear
  before-and-after comparison. TalkFit supports Traditional Chinese and English,
  uses explainable on-device rules, does not save recordings or transcripts, and
  includes a reliable demo fallback when speech recognition is unavailable.
