  zh-TW:
    name: TalkFit｜綠園練習簿
    intro: |
      TalkFit｜讓每一次開口，都成為看得見的成長。

      我們經常知道自己「好像講得不夠清楚」，卻不知道究竟該先改哪裡。重新聽完整段錄音很花時間，只有逐字稿或一個分數，也很難回答下一次到底要怎麼說。TalkFit 把模糊的挫折縮小成一個立即可做的行動：找出最值得改善的一小段、馬上重練，然後清楚看見前後真的不一樣。

      TalkFit 是一款溫暖、低壓力的 iOS 私人口說教練，為準備自我介紹、課堂報告、面試回答、簡報與公開發言的學生、工作者與講者而設計。它不是網頁版錄音工具、不是社群競賽，也不是醫療診斷或治療服務；它是一座只屬於自己的練習小園地，讓使用者透過短而專注的重複練習，慢慢建立表達自信。

      【從開口到看見進步】

      1. 選擇真實情境：30 秒自我介紹、簡報、課堂報告、面試回答，或貼上完整講稿後挑選段落。
      2. 自然錄音：畫面同步顯示時間、真實音量波形、即時逐字稿、剛剛捕捉到的贅字證據，以及最新一句的語速提醒。
      3. 看見一個最重要的建議：TalkFit 不用密密麻麻的儀表板轟炸使用者，而是先說清楚現在最值得改善什麼。
      4. 點開關鍵片段：保留原句，搭配一個具體、能立即執行的教練提醒。
      5. 只重練這一小段：不必因為一句話卡住，就把整篇重新講一次。
      6. 比較前後差異：從贅字數、語速、節奏提醒與穩定度，確認第二次是否真的更清楚。

      【一位不製造壓力的教練】

      TalkFit 不把口說練習做成考試。這裡沒有排行榜、連續打卡壓力，也不會用冰冷分數宣告一段話「好或不好」。「綠園練習簿」視覺以溫暖纖維紙、松綠、苔綠、嫩芽與少量陶土橘，營造安靜、私密又有觸感的練習空間。成長不是一次完美，而是每次願意再說一遍，都長出一點新的自信。

      【可理解、可解釋的本機分析】

      App 使用 Apple Speech 產生逐字稿，再以透明、可重現的本機規則分析表達。中文使用「字／分鐘」，英文使用「詞／分鐘」計算語速；另外觀察逐句時間、句尾停頓過短或過長、突然加速、贅字密度與整體穩定度。TalkFit 給出的不是來歷不明的 AI 判決，而是使用者看得懂、也知道如何改善的具體線索。

      Apple 最終逐字稿為了讓文字更流暢，可能省略「嗯」「呃」「um」「uh」等短暫語氣聲。因此 TalkFit 將「可讀文字」與「贅字證據」分成兩條軌道保存：最終辨識負責產生乾淨、可閱讀的正文；partial results、候選辨識、segment 時間戳與 confidence 則負責蒐集可能被省略的贅字。同一個聲音會依時間去重；若聲音證據曾捕捉到、但不適合硬塞回正文，報告會在「聲音裡還聽到」獨立呈現。使用者也能分別調整中文與英文贅字庫，加入自己真正的口頭習慣。

      【為真實簡報與講稿而設計】

      使用者可以切換繁體中文與英文，依不同情境取得適合的題目與舒服語速建議，也能貼上自己的完整講稿、分段練習。講稿模式以簡單清楚的本機比對呈現內容涵蓋，提醒可能漏掉的幾個關鍵詞；它不要求逐字背誦，也不把字詞比對包裝成神奇的語意理解。主畫面 Widget 則讓使用者在重要開口前，用更短的路徑回到練習。

      【隱私由使用者決定】

      TalkFit 沒有用來接收語音內容或分析結果的自有雲端後端。裝置支援時會優先要求 Apple 裝置端語音辨識；實際辨識方式與可用性仍由 Apple 和使用者的裝置決定。練習紀錄預設由使用者選擇是否開啟；開啟後，摘要與使用者的真實錄音可以只保存在這台 iPhone，方便日後回聽。講稿、逐字稿、逐句內容與贅字時間戳不會寫入錄音紀錄；示範練習永遠不會保存。使用者可隨時停止新增紀錄、刪除單次練習或清除保存內容。

      【辨識失敗也不冒充使用者】

      麥克風權限、Apple Speech 服務與 Simulator 狀況並不永遠穩定。TalkFit 不會在使用者真實錄音後，偷偷用「我是小安」等無關範例取代他說過的話。只要有可用的 partial 或真實文字，就保留原內容；完全無法取得辨識結果時，會坦白說明並提供重新錄音，或由使用者主動選擇明確標示的示範練習。確定性的備援 Service 可以可靠走完「錄音 → 報告 → 重練 → 前後比較」，但絕不假裝那是真實分析。

      TalkFit 最重要的時刻很簡單：使用者說完一次後，知道自己下一步該重練哪一句；不到一分鐘，又能親眼看見第二次變得更直接、更穩、更清楚。與其只叫人「說好一點」，TalkFit 給每個人一個真正可以開始的地方。
